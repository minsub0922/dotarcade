# Render Blueprint — 대시보드에서 New → Blueprint → 이 레포 선택하면 자동 적용
# 시크릿(sync: false)은 생성 시 입력 프롬프트가 뜬다.
services:
  - type: web
    name: dotarcade-back
    runtime: docker
    plan: free
    dockerfilePath: ./back/Dockerfile
    dockerContext: ./back
    healthCheckPath: /api/config
    envVars:
      - key: BACK_PORT
        value: "10000"
      - key: BACK_GEMINI_API_KEY
        sync: false
      - key: BACK_TAVILY_API_KEYS
        sync: false
      - key: BACK_LLM_MODE
        value: auto
